name: Refresh README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards from the GitHub API
        env:
          GITHUB_USER: albgoor
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional personal access token; contributions are omitted when no token can read them.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/generate_readme_assets.py

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/languages-*.svg assets/edge-radar-*.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh README stats cards"
            git push
          fi
